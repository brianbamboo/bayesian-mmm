[project]
name = "bayesian-mmm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brian Wang", email = "brianwang92@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "arviz>=0.23.4",
    "jupyter>=1.1.1",
    "llvmlite==0.45.1",
    "matplotlib>=3.11.2",
    "numba==0.62.1",
    "numpy>=2.2",
    "pandas>=3.1.1",
    "pymc>=5.28.5",
    "pymv>=1.4",
    "scipy>=1.15",
    "seaborn>=0.13.2",
]

[project.scripts]
bayesian-mmm = "bayesian_mmm:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
